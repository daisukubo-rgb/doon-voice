name: DOON Voice Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (例: v0.5.3)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  package:
    name: ${{ matrix.name }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: macOS Apple Silicon
            runner: macos-14
            target: ''
            args: ''
          - name: Windows
            runner: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}
      - run: npm ci
      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: DOON Voice ${{ env.RELEASE_TAG }}
          releaseBody: |
            DOON Voiceの配布版です。

            macOSはDMG、WindowsはMSIをダウンロードしてください。
            初回起動後に音声認識モデルを取得し、必要なAIを接続してください。
          releaseDraft: false
          prerelease: false
      - name: Package installer ZIP
        run: npm run package:zip
      - name: Upload installer ZIP
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/DOON Voice-*.zip
          draft: false
          prerelease: false
