name: DOON Voice CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "docs/**"
      - "DOON Voiceを起動.command"
      - "DOON Voiceを起動.bat"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.test.json"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "scripts/**"
      - "test/**"
      - "docs/**"
      - "DOON Voiceを起動.command"
      - "DOON Voiceを起動.bat"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "tsconfig.test.json"
      - ".github/workflows/**"

jobs:
  macos:
    name: macOS quality gate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: node scripts/check-licenses.mjs
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows:
    name: Windows quality gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Exercise real setup and npm ci on Windows
        run: node scripts/setup.mjs
      - run: node scripts/test-windows-engine.mjs
      - run: node scripts/check-licenses.mjs
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
